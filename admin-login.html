<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlyWatch.AI Admin | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0A2342;
            --secondary: #4A90E2;
            --admin-accent: #E63946;
            --light-blue: #85C1E9;
            --pale-blue: #AED6F1;
            --bg-dark: #0D1B2A;
            --text-light: #E0E1DD;
            --grid-color: rgba(74, 144, 226, 0.15);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, #1a0a0f 0%, var(--primary) 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 49px, var(--grid-color) 49px, var(--grid-color) 50px),
                repeating-linear-gradient(90deg, transparent, transparent 49px, var(--grid-color) 49px, var(--grid-color) 50px);
            opacity: 0.3;
            z-index: 0;
            animation: gridPulse 4s ease-in-out infinite;
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.4; }
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .admin-badge {
            background: linear-gradient(135deg, var(--admin-accent) 0%, #c62828 100%);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .logo-container {
            text-align: center;
            margin-bottom: 40px;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-svg {
            max-width: 320px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 30px rgba(230, 57, 70, 0.3));
        }

        .login-box {
            background: linear-gradient(135deg, rgba(10, 35, 66, 0.95) 0%, rgba(27, 38, 59, 0.9) 100%);
            border: 2px solid var(--admin-accent);
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(230, 57, 70, 0.3);
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-title {
            font-family: 'Orbitron', monospace;
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--admin-accent) 0%, #FFFFFF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-align: center;
        }

        .login-subtitle {
            font-size: 1rem;
            color: var(--light-blue);
            text-align: center;
            margin-bottom: 35px;
            letter-spacing: 2px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-label {
            display: block;
            font-size: 0.9rem;
            color: var(--pale-blue);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .input-field {
            width: 100%;
            padding: 18px;
            background: rgba(13, 27, 42, 0.8);
            border: 2px solid rgba(230, 57, 70, 0.3);
            border-radius: 12px;
            color: var(--text-light);
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--admin-accent);
            box-shadow: 0 0 25px rgba(230, 57, 70, 0.4);
            background: rgba(13, 27, 42, 0.95);
        }

        .login-button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--admin-accent) 0%, #c62828 100%);
            color: white;
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(230, 57, 70, 0.5);
        }

        .login-button:active {
            transform: translateY(-1px);
        }

        .error-message {
            color: #FF6B6B;
            background: rgba(230, 57, 70, 0.2);
            border: 1px solid var(--admin-accent);
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            display: none;
            animation: shake 0.5s;
        }

        .info-text {
            text-align: center;
            margin-top: 30px;
            font-size: 0.85rem;
            color: rgba(224, 225, 221, 0.5);
            line-height: 1.6;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: var(--light-blue);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .back-link a:hover {
            color: white;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-15px); }
            75% { transform: translateX(15px); }
        }

        @media (max-width: 600px) {
            .login-box {
                padding: 35px 25px;
            }
            .login-title {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="admin-badge">🔒 ADMINISTRATOR ACCESS</div>
        
        <div class="logo-container">
            <svg class="logo-svg" viewBox="0 0 300 80" xmlns="http://www.w3.org/2000/svg">
                <circle cx="40" cy="40" r="35" fill="#E63946" opacity="0.2"/>
                <circle cx="40" cy="40" r="32" fill="none" stroke="#E63946" stroke-width="2"/>
                <g transform="translate(40, 40)">
                    <path d="M -8 -4 L 8 0 L -8 4 Z" fill="#E63946"/>
                    <path d="M -12 -8 L -4 -2 L -4 2 L -12 8 L -10 0 Z" fill="#FF6B6B"/>
                    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
                </g>
                <text x="85" y="45" font-family="'Orbitron', Arial, sans-serif" font-size="28" font-weight="900" fill="url(#adminGradient)">FlyWatch</text>
                <text x="235" y="45" font-family="'Orbitron', Arial, sans-serif" font-size="28" font-weight="900" fill="#E63946">.AI</text>
                <text x="85" y="62" font-family="'Rajdhani', Arial, sans-serif" font-size="11" font-weight="600" fill="#FF6B6B" letter-spacing="2">ADMIN PORTAL</text>
                <defs>
                    <linearGradient id="adminGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#E63946;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:1" />
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <div class="login-box">
            <div class="login-title">ADMIN LOGIN</div>
            <div class="login-subtitle">System Administration</div>
            
            <div class="input-group">
                <label class="input-label">Username</label>
                <input type="text" class="input-field" id="username" placeholder="Enter admin username" autocomplete="username">
            </div>

            <div class="input-group">
                <label class="input-label">Password</label>
                <input type="password" class="input-field" id="password" placeholder="Enter admin password" autocomplete="current-password">
            </div>
            
            <button class="login-button" onclick="login()">ACCESS ADMIN PANEL</button>
            
            <div class="error-message" id="errorMessage">
                ✗ Invalid credentials. Please try again.
            </div>

            <div class="info-text">
                Restricted area. Authorized administrators only.
            </div>
        </div>

        <div class="back-link">
            <a href="index.html">← Back to Customer Portal</a>
        </div>
    </div>

    <script>
        // Admin credentials (in production, this would be server-side authentication)
        const ADMIN_CREDENTIALS = {
            'admin': 'flywatch2024',
            'superadmin': 'flywatch2024',
            'afi-admin': 'AFI2024Admin'
        };

        // Focus username on load
        window.onload = function() {
            document.getElementById('username').focus();
        };

        // Allow Enter key to submit
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });

        document.getElementById('username').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('password').focus();
            }
        });

        function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            
            // Check credentials
            if (ADMIN_CREDENTIALS[username] && ADMIN_CREDENTIALS[username] === password) {
                // Store admin session
                sessionStorage.setItem('admin_auth', 'true');
                sessionStorage.setItem('admin_user', username);
                sessionStorage.setItem('admin_login_time', new Date().toISOString());
                
                // Redirect to admin dashboard
                window.location.href = 'admin-dashboard.html';
            } else {
                // Show error
                errorMessage.style.display = 'block';
                document.getElementById('password').value = '';
                document.getElementById('username').focus();
                
                // Shake animation
                document.querySelector('.login-box').style.animation = 'shake 0.5s';
                setTimeout(() => {
                    document.querySelector('.login-box').style.animation = '';
                    errorMessage.style.display = 'none';
                }, 3000);
            }
        }

        // Check if already logged in
        if (sessionStorage.getItem('admin_auth') === 'true') {
            window.location.href = 'admin-dashboard.html';
        }
    </script>
</body>
</html>
