<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft Compliance Dashboard | FlyWatch.AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #0A2342;
            --secondary: #4A90E2;
            --success: #70AD47;
            --warning: #FFC000;
            --danger: #E63946;
            --bg-dark: #0D1B2A;
            --bg-light: #1B263B;
            --text-light: #E0E1DD;
        }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--primary) 100%);
            color: var(--text-light);
            padding: 20px;
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        .header {
            background: rgba(27, 38, 59, 0.95);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid var(--secondary);
        }
        h1 {
            color: var(--secondary);
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .filters {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .filter-badge {
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .filter-expired { background: var(--danger); color: white; }
        .filter-10days { background: #FF6B6B; color: white; }
        .filter-30days { background: var(--warning); color: var(--primary); }
        .filter-60days { background: #90CAF9; color: var(--primary); }
        .filter-ok { background: var(--success); color: white; }
        .btn {
            padding: 12px 24px;
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            margin: 5px;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #357ABD;
            transform: translateY(-2px);
        }
        .btn-success { background: var(--success); }
        .btn-small { padding: 6px 12px; font-size: 0.85rem; }
        .dashboard-card {
            background: rgba(27, 38, 59, 0.95);
            border-radius: 15px;
            padding: 30px;
            border: 1px solid var(--secondary);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            min-width: 1200px;
        }
        th {
            background: var(--primary);
            color: var(--secondary);
            padding: 15px 10px;
            text-align: center;
            font-weight: 700;
            font-size: 0.85rem;
            border: 1px solid rgba(74, 144, 226, 0.3);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        th.aircraft-col {
            text-align: left;
            padding-left: 20px;
            min-width: 120px;
        }
        td {
            padding: 12px 10px;
            text-align: center;
            border: 1px solid rgba(74, 144, 226, 0.2);
        }
        td.aircraft-col {
            text-align: left;
            padding-left: 20px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--secondary);
        }
        tr:hover {
            background: rgba(74, 144, 226, 0.1);
        }
        .status-badge {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
            min-width: 90px;
            cursor: pointer;
        }
        .status-expired { background: var(--danger); color: white; }
        .status-warning { background: var(--warning); color: var(--primary); }
        .status-ok { background: var(--success); color: white; }
        .status-permanent { background: #6B7280; color: white; }
        .status-missing { background: transparent; color: var(--text-light); opacity: 0.5; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: var(--bg-light);
            padding: 40px;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            border: 2px solid var(--secondary);
        }
        .form-group {
            margin: 20px 0;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: var(--secondary);
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 12px;
            background: var(--bg-dark);
            border: 2px solid var(--secondary);
            color: white;
            border-radius: 8px;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Aircraft Compliance Dashboard - <span id="orgName"></span></h1>
            <div class="filters">
                <div class="filter-badge filter-expired">Expired</div>
                <div class="filter-badge filter-10days">10 days</div>
                <div class="filter-badge filter-30days">30 days</div>
                <div class="filter-badge filter-60days">60 days</div>
                <div class="filter-badge filter-ok">&gt;60 days</div>
            </div>
            <div style="margin-top: 20px;">
                <button class="btn" onclick="window.history.back()">← Back to Portal</button>
                <button class="btn btn-success" onclick="exportCSV()">📥 Export CSV</button>
            </div>
        </div>

        <div class="dashboard-card">
            <table id="complianceTable">
                <thead>
                    <tr id="tableHeader"></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- ADD/EDIT DOCUMENT MODAL -->
    <div id="docModal" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--secondary); margin-bottom: 20px;">Update Document</h2>
            <div class="form-group">
                <label>Aircraft</label>
                <input type="text" id="modalAircraft" readonly>
            </div>
            <div class="form-group">
                <label>Document Type</label>
                <input type="text" id="modalDocType" readonly>
            </div>
            <div class="form-group">
                <label>Reference</label>
                <input type="text" id="modalReference" placeholder="e.g., McGill and Partners, SACAA">
            </div>
            <div class="form-group">
                <label>Issue Date</label>
                <input type="date" id="modalIssueDate">
            </div>
            <div class="form-group">
                <label>Expiry Date</label>
                <input type="date" id="modalExpiryDate">
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" id="modalPermanent" style="width: auto;">
                    Permanent (Never expires)
                </label>
            </div>
            <div style="margin-top: 30px;">
                <button class="btn btn-success" onclick="saveDocument()">💾 Save</button>
                <button class="btn" onclick="closeModal()" style="background: var(--danger);">Cancel</button>
            </div>
        </div>
    </div>

<script src="aircraft-config-data.js"></script>
<script>
console.log('=== COMPLIANCE DASHBOARD LOADING ===');

// DOCUMENT TYPES (from picklists)
const DOCUMENT_TYPES = [
    'Certificate of Insurance',
    'Certificate of Registration',
    'Certificate of Release to Service',
    'Airworthiness Certificate',
    'Weight and Balance Certificate',
    'Noise Certificate',
    'Radio Station License',
    'MEL',
    'Trends',
    'Fire Extinguishers',
    'First Aid Kit',
    'Data Plate',
    'Airplane Flight Manual',
    'Photo',
    'Account Status'
];

let currentOrg = 'barrick';
let complianceData = {};

// INITIALIZE
window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    const aircraft = params.get('aircraft') || 'ZS-BGM';
    
    if (aircraft.includes('BGM') || aircraft.includes('BGO') || aircraft.includes('CGO') || aircraft.includes('KGM')) {
        currentOrg = 'barrick';
    } else if (aircraft.includes('MPT')) {
        currentOrg = 'mccormick';
    } else {
        currentOrg = 'highveld';
    }
    
    document.getElementById('orgName').textContent = currentOrg.toUpperCase();
    
    loadComplianceData();
    renderDashboard();
};

function loadComplianceData() {
    const stored = localStorage.getItem('compliance_' + currentOrg);
    if (stored) {
        complianceData = JSON.parse(stored);
    } else {
        complianceData = {};
    }
    console.log('Loaded compliance data:', complianceData);
}

function saveComplianceData() {
    localStorage.setItem('compliance_' + currentOrg, JSON.stringify(complianceData));
}

function renderDashboard() {
    const aircraft = getOrgAircraft(currentOrg);
    if (!aircraft || aircraft.length === 0) return;
    
    // BUILD HEADER
    const header = document.getElementById('tableHeader');
    header.innerHTML = '<th class="aircraft-col">Aircraft</th>';
    DOCUMENT_TYPES.forEach(docType => {
        header.innerHTML += `<th>${docType}</th>`;
    });
    
    // BUILD ROWS
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    
    aircraft.forEach(ac => {
        const row = document.createElement('tr');
        row.innerHTML = `<td class="aircraft-col">${ac.registration}</td>`;
        
        DOCUMENT_TYPES.forEach(docType => {
            const doc = getDocument(ac.registration, docType);
            const badge = createBadge(ac.registration, docType, doc);
            row.innerHTML += `<td>${badge}</td>`;
        });
        
        tbody.appendChild(row);
    });
}

function getDocument(aircraft, docType) {
    const key = aircraft + '_' + docType;
    return complianceData[key] || null;
}

function createBadge(aircraft, docType, doc) {
    if (!doc) {
        return `<span class="status-badge status-missing" onclick="openModal('${aircraft}', '${docType}')">not listed</span>`;
    }
    
    if (doc.permanent) {
        return `<span class="status-badge status-permanent" onclick="openModal('${aircraft}', '${docType}')">Permanent</span>`;
    }
    
    const daysToExpiry = calculateDaysToExpiry(doc.expiryDate);
    
    let className, text;
    if (daysToExpiry < 0) {
        className = 'status-expired';
        text = doc.expiryDate;
    } else if (daysToExpiry <= 10) {
        className = 'status-expired';
        text = doc.expiryDate;
    } else if (daysToExpiry <= 30) {
        className = 'status-warning';
        text = doc.expiryDate;
    } else if (daysToExpiry <= 60) {
        className = 'status-warning';
        text = doc.expiryDate;
    } else {
        className = 'status-ok';
        text = doc.expiryDate;
    }
    
    return `<span class="status-badge ${className}" onclick="openModal('${aircraft}', '${docType}')">${text}</span>`;
}

function calculateDaysToExpiry(expiryDate) {
    if (!expiryDate) return 9999;
    const today = new Date();
    const expiry = new Date(expiryDate);
    const diffTime = expiry - today;
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    return diffDays;
}

let currentEditAircraft = null;
let currentEditDocType = null;

function openModal(aircraft, docType) {
    currentEditAircraft = aircraft;
    currentEditDocType = docType;
    
    document.getElementById('modalAircraft').value = aircraft;
    document.getElementById('modalDocType').value = docType;
    
    const doc = getDocument(aircraft, docType);
    if (doc) {
        document.getElementById('modalReference').value = doc.reference || '';
        document.getElementById('modalIssueDate').value = doc.issueDate || '';
        document.getElementById('modalExpiryDate').value = doc.expiryDate || '';
        document.getElementById('modalPermanent').checked = doc.permanent || false;
    } else {
        document.getElementById('modalReference').value = '';
        document.getElementById('modalIssueDate').value = '';
        document.getElementById('modalExpiryDate').value = '';
        document.getElementById('modalPermanent').checked = false;
    }
    
    document.getElementById('docModal').classList.add('show');
}

function closeModal() {
    document.getElementById('docModal').classList.remove('show');
}

function saveDocument() {
    const key = currentEditAircraft + '_' + currentEditDocType;
    
    complianceData[key] = {
        reference: document.getElementById('modalReference').value,
        issueDate: document.getElementById('modalIssueDate').value,
        expiryDate: document.getElementById('modalExpiryDate').value,
        permanent: document.getElementById('modalPermanent').checked
    };
    
    saveComplianceData();
    renderDashboard();
    closeModal();
    
    console.log('Document saved:', complianceData[key]);
}

function exportCSV() {
    const aircraft = getOrgAircraft(currentOrg);
    let csv = 'Aircraft,' + DOCUMENT_TYPES.join(',') + '\n';
    
    aircraft.forEach(ac => {
        let row = ac.registration;
        DOCUMENT_TYPES.forEach(docType => {
            const doc = getDocument(ac.registration, docType);
            if (!doc) {
                row += ',not listed';
            } else if (doc.permanent) {
                row += ',Permanent';
            } else {
                row += ',' + doc.expiryDate;
            }
        });
        csv += row + '\n';
    });
    
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'compliance_' + currentOrg + '_' + new Date().toISOString().split('T')[0] + '.csv';
    a.click();
}
</script>
</body>
</html>
